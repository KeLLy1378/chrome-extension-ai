<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="app">
            <div class="card">
                <h1 class="card__name">Упрощение текста</h1>
                <p class="card__text">Уровень упрощения</p>
                <div class="dropdown">
                    <select name="Simplify level">
                        <option value="easy">Лёгкий</option>
                        <option value="medium">Средний</option>
                        <option value="hard">Сильный</option>
                    </select>
                </div>
                <div class="buttons"> 
                    <button class="btn">Упростить</button>
                    <button class="btn">Вернуть оригинал</button>
                </div>
                <div class="img">
                    <img src="Images/Vector.svg">
                    
                </div>

            </div>
        </div>
    </div>
    <script src="popup.js" type="module"></script>
</body>
</html>

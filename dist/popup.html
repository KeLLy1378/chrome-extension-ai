<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Упрощение текста</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="extension-version-badge"></div>
    <div class="container">
        <div class="app">
            <div class="card">
                <h1 class="card__name">Упрощение текста</h1>
                <p class="card__text">Уровень упрощения</p>

                <div class="dropdown">
                     <button id="infoBtn" class="info-btn" type="button">?</button>
                    <select id="levelSelect" name="Simplify level">
                        <option value="easy">Лёгкий</option>
                        <option value="medium">Средний</option>
                        <option value="hard">Сильный</option>
                    </select>
                </div>

                <div id="overlay" class="overlay hidden">
                    <div class="modal">
                        <h3>Уровни упрощения</h3>
                        <p><strong>Лёгкий</strong> - текст почти как оригинал, но чуть яснее и чище</p>
                        <p><strong>Средний</strong> - понятнее оригинала, но важные термины сохраняются</p>
                        <p><strong>Сильный</strong> - максимально просто, почти без сложных терминов</p>
                        <button id="closeOverlay" class="closeOverlay">Закрыть</button>
                    </div>
                </div>

                <div class="api-key-field">
                    <label for="apiKeyInput">API ключ</label>
                    <input id="apiKeyInput" type="password" placeholder="Введите API ключ">
                    <label class="api-key-checkbox"><input type="checkbox" id="showApiKey"> Показать ключ</label>
                </div>

                <!--<div class="buttons"> 
                    <button class="btn" id="simplifyBtn">Упростить весь текст на странице</button>
                </div>-->
                <div class="img">
                    <img src="Images/Vector.svg">
                </div>
            </div>
        </div>
    </div>
    <script src="popup.js" type="module"></script>
</body>
</html>

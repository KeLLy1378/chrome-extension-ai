<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Упрощение текста</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="extension-version-badge"></div>
    <div class="container">
        <div class="app">
            <div class="card">
                <h1 class="card__name">Упрощение текста</h1>

                <div class="dropdown">
                    <button id="infoBtn" class="info-btn" type="button">?</button>
                </div>

                <div id="overlay" class="overlay hidden">
                    <div class="modal">
                        <h3>Уровни упрощения</h3>
                        <p><strong>Упростить язык</strong> — тот же объём, читается легче. Термины сохраняются.</p>
                        <p><strong>Сократить</strong> — короче на треть, главное сохранено.</p>
                        <p><strong>Выжать суть</strong> — только ключевые мысли, коротко.</p>
                        <button id="closeOverlay" class="closeOverlay">Закрыть</button>
                    </div>
                </div>

                <label class="toggle-label">
                    <input type="checkbox" id="toggleFloatingBtn" checked>
                    Показывать кнопку Simply на странице
                </label>

                <div class="img">
                    <img src="Images/Vector.svg">
                </div>
            </div>
        </div>
    </div>
    <script src="popup.js" type="module"></script>
</body>
</html>

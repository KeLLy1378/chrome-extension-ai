<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overlay Preview</title>
    <link rel="stylesheet" href="overlay.css">
</head>
<body>
    <h1>Overlay Preview</h1>

    <section>
        <h2>Text Adaption Overlay</h2>
        <div id="text-adaption-overlay" class="preview-open">
            <div class="text-adapter-title">Адаптация текста</div>
            <div class="text-adapter-actions">
                <select id="simplification-level">
                    <option value="easy">Легкое упрощение</option>
                    <option value="medium">Среднее упрощение</option>
                    <option value="hard">Сильное упрощение</option>
                </select>
                <button id="simplify-button" class="text-adapter-button primary">Упростить</button>
                <button id="close-overlay-button" class="text-adapter-button secondary">Закрыть</button>
            </div>
        </div>
    </section>

    <section>
        <h2>Chat Preview</h2>
        <div class="preview-chat-row">
            <button id="ai-chat-floating-button" class="preview-chat-button">Chat</button>
            <div id="ai-chat-overlay" class="preview-chat-overlay">
                <div class="ai-chat-header">
                    <span>Simply</span>
                    <button id="close-chat-overlay">✕</button>
                </div>
                <div id="ai-chat-messages" class="ai-chat-messages">
                    <div class="ai-chat-message user">Упрости этот текст пожалуйста</div>
                    <div class="ai-chat-message assistant">Конечно! Выделите текст и выберите уровень упрощения.</div>
                    <div class="ai-chat-message user">А можно сильное упрощение?</div>
                    <div class="ai-chat-message assistant">Да, выберите "Сильное упрощение".</div>
                </div>
                <div class="ai-chat-input-container">
                    <input id="ai-chat-input" type="text" placeholder="Напишите сообщение...">
                    <button id="send-chat-message">Отправить</button>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
